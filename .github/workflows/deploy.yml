name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate site
        env:
          GITALK_CLIENT_ID: ${{ secrets.GITALK_CLIENT_ID }}
          GITALK_SECRET: ${{ secrets.GITALK_SECRET }}
        run: npx hexo generate

      - name: Setup SSH key for deploy
        env:
          DEPLOY_KEY: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure git identity
        run: |
          git config --global user.name "chalmery"
          git config --global user.email "chalmery@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes
        run: npx hexo deploy

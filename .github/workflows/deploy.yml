name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate site
        env:
          GITALK_CLIENT_ID: ${{ secrets.GITALK_CLIENT_ID }}
          GITALK_SECRET: ${{ secrets.GITALK_SECRET }}
        run: npx hexo generate

      - name: Setup SSH agent and deploy key
        env:
          DEPLOY_KEY: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "=== 私钥指纹 ==="
          ssh-keygen -lf ~/.ssh/deploy_key 2>&1 || echo "!!! 私钥无效，请检查 Secret 内容 !!!"
          # 启动 ssh-agent 并加载私钥
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key 2>&1
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "=== SSH 认证测试 ==="
          ssh -T git@github.com 2>&1 || true
          # 把 agent 信息传给后续步骤
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Configure git identity
        run: |
          git config --global user.name "chalmery"
          git config --global user.email "chaochaoycc@gmail.com"

      - name: Deploy to GitHub Pages
        run: npx hexo deploy

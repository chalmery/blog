name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish to chalmery.github.io
        env:
          DEPLOY_KEY: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          PUBLISH_DIR: ${{ runner.temp }}/chalmery-pages
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          echo "$DEPLOY_KEY" | base64 -d > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          ssh-keyscan github.com > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"

          git clone --depth 1 --branch master git@github.com:chalmery/chalmery.github.io.git "$PUBLISH_DIR"
          test -d "$PUBLISH_DIR/.git"
          touch dist/.nojekyll
          rsync -a --delete --exclude=.git dist/ "$PUBLISH_DIR/"

          git -C "$PUBLISH_DIR" config user.name "chalmery"
          git -C "$PUBLISH_DIR" config user.email "chaochaoycc@gmail.com"
          git -C "$PUBLISH_DIR" add --all
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git -C "$PUBLISH_DIR" commit -m "Deploy Astro site from ${GITHUB_SHA::7}"
          git -C "$PUBLISH_DIR" push origin master
